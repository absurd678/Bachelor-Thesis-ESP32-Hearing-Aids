; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 921600
lib_deps = paulstoffregen/Time@^1.6.1
monitor_filters = esp32_exception_decoder  ; auto-decodes crash stack traces
build_type = debug         ; keeps symbol names for readable crash logs
build_flags =
  -DCORE_DEBUG_LEVEL=4   ; 0=none 1=error 2=warn 3=info 4=debug 5=verbose
  -DUSE_WEIGHTS_FILE="C:\Users\Artem\Documents\PlatformIO\Projects\Hearing aids ESP32\lib\rnnoise\weights_blob.bin"